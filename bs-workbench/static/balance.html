<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HSJ 动平衡试验分析</title><script src="/desktop-client.js" defer></script><link rel="stylesheet" href="/balance.css"><link rel="stylesheet" href="/workspace.css"><script src="/balance.js" defer></script><script src="/workspace.js" defer></script><script src="/save-target.js" defer></script></head>
<body class="balance-layout">
<header><a href="/">波形与频谱</a><strong>动平衡分析</strong><nav id="commands" aria-label="动平衡操作"><button data-action="load-before">加载配重前数据</button><button data-action="load-after">加载配重后数据</button><button data-action="analyze-before">配重前分析</button><button data-action="analyze-after">配重后分析</button><button data-action="cancel-before">取消前侧选择</button><button data-action="cancel-after">取消后侧选择</button><button data-action="reset">重绘</button><button data-action="compute">配重计算</button><button data-action="decompose">配重分解</button><button data-action="save">保存视图 / 报表</button><button data-action="config-save">保存配置</button><button data-action="config-open">载入配置</button></nav><input id="config-file" type="file" accept=".json" hidden></header>
<div class="balance-strip" id="balance-strip"><span>配重前采样周期数：<output id="before-count">0</output></span><span>配重后采样周期数：<output id="after-count">0</output></span><span class="legend"><i class="original"></i>原始振动</span><span class="legend"><i class="trial"></i>试重振动</span><span class="legend"><i class="trial-weight"></i>试重块</span><span class="legend"><i class="balance-weight"></i>配重块</span><span class="legend"><i class="components"></i>配重分解</span><label>旋转：<select id="rotation"><option value="clockwise">顺时针旋转</option><option value="counterclockwise">逆时针旋转</option></select></label></div>
<main id="balance-main"><section class="wave-panel" id="before-panel"><h2 id="before-title">配重前</h2><div class="canvas-frame"><canvas id="before-wave" tabindex="0" aria-label="配重前波形。拖动框选完整周期，双击设置周期起点，随后单击设置终点。"></canvas></div></section><section class="wave-panel" id="after-panel"><h2 id="after-title">配重后</h2><div class="canvas-frame"><canvas id="after-wave" tabindex="0" aria-label="配重后波形。拖动框选完整周期，双击设置周期起点，随后单击设置终点。"></canvas></div></section><section class="vector-panel"><h2 id="vector-title">动平衡试验分析</h2><div class="canvas-frame"><canvas id="vector" tabindex="0" aria-label="动平衡圆形矢量图，零度在右，旋转方向决定相位方向。"></canvas></div></section></main>
<section id="balance-table-wrap" aria-label="动平衡参数表"><table id="balance-table"><colgroup><col class="row-name"><col><col><col><col><col><col></colgroup><thead><tr><th aria-label="状态"></th><th>转速(转/分)</th><th>总振值(双峰)</th><th>转频幅值(双峰)</th><th>转频相位(°)</th><th>配重重量(kg)</th><th>配重角度(°)</th></tr></thead><tbody id="balance-rows"></tbody></table></section>
<footer id="status" role="status">加载配重前 / 配重后通道数据后，在各自波形中选取1～16个完整周期。</footer>
<dialog id="source-dialog"><form id="source-form"><h2 id="source-heading">加载配重前通道数据</h2><label>分拣文件：<select id="source-file" required><option value="">请选择分拣文件</option></select></label><label>试验类型：<select id="source-type" disabled required><option value="">请先选择分拣文件</option></select></label><label>参数类型：<select id="source-condition" disabled required><option value="">请先选择试验类型</option></select></label><label>通道数据：<select id="source-channel" disabled required><option value="">请先选择参数类型</option></select></label><p id="source-error" class="error" role="alert"></p><div class="actions"><button type="submit" id="source-confirm" disabled>确定</button><button type="button" data-close="source-dialog">取消</button></div></form></dialog>
<dialog id="range-dialog"><form id="range-form"><h2 id="range-heading">选取分析时段</h2><p>起止边界自动对齐所选范围内的首尾键相点。</p><label>开始时间(s)<input id="range-start" type="number" min="0" step="any" required></label><label>结束时间(s)<input id="range-end" type="number" min="0" step="any" required></label><label><input id="range-analyze" type="checkbox" checked>确定后分析选定周期</label><p id="range-error" class="error"></p><div class="actions"><button type="submit">确定</button><button type="button" data-close="range-dialog">取消</button></div></form></dialog>
<dialog id="export-dialog"><form id="export-form"><h2>保存动平衡分析</h2><label>内容<select id="export-kind"><option value="image">保存当前完整视图</option><option value="xlsx">Excel 报表 XLSX</option><option value="docx">Word 报表 DOCX</option><option value="xls">原版 XLS（本机 Excel）</option><option value="doc">原版 DOC（本机 Word）</option><option value="txt">参数表 TXT</option></select></label><label>图像格式<select id="export-format"><option>png</option><option>bmp</option><option>jpg</option><option>gif</option><option>tiff</option></select></label><label>文件名<input id="export-name" maxlength="150" value="动平衡试验分析" required></label><p id="export-error" class="error"></p><div class="actions"><button type="submit">保存</button><button type="button" data-close="export-dialog">取消</button></div></form></dialog>
<div id="balance-menu" role="menu" hidden></div>
</body></html>
