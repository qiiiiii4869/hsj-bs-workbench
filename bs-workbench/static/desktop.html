<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HSJ 数据分析工作区</title><link rel="stylesheet" href="/desktop.css"><script src="/desktop.js" defer></script><script src="/save-target.js" defer></script></head><body><header><strong>HSJ 数据分析</strong><label>新建视图<select id="module"><option value="/">波形与频谱</option><option value="/strip">波形长图</option><option value="/waterfall">三维频谱瀑布图</option><option value="/waterfall?mode=wave">三维波形瀑布图</option><option value="/specialty?module=orbit">轴心轨迹</option><option value="/specialty?module=correlation">相关分析</option><option value="/specialty?module=trend">趋势分析</option><option value="/specialty?module=balance">动平衡分析</option><option value="/specialty?module=jigger">盘车试验</option><option value="/specialty?module=efficiency">效率分析</option><option value="/specialty?module=cam">协联工况</option><option value="/specialty?module=airgap">圆度拟合</option></select></label><button id="new">新建</button><button id="maximize">当前视图</button><button id="tile">平铺</button><button id="cascade">层叠</button><button id="close">关闭当前</button><button id="close-all">全部关闭</button><button id="refresh">刷新当前</button><button id="exit">退出程序</button><button id="restore">恢复上次窗口</button><label><input id="color" type="checkbox" checked>彩色标签</label></header><nav id="tabs" role="tablist" aria-label="分析窗口"></nav><main id="windows"><p id="empty">没有打开的分析视图，请选择模块后点击“新建”。</p></main><footer id="status" role="status">就绪</footer></body></html>
