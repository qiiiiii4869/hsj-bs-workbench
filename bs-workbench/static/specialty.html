<!doctype html><html lang="zh-CN"><head><script src="/desktop-client.js" defer></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HSJ 专项分析</title><link rel="stylesheet" href="/specialty.css"><script src="/specialty.js" defer></script><script src="/specialty-extra.js" defer></script><script src="/balance-grid.js" defer></script><link rel="stylesheet" href="/orbit-layout.css"><script src="/orbit-layout.js" defer></script><link rel="stylesheet" href="/workspace.css"><script src="/workspace.js" defer></script><script src="/save-target.js" defer></script></head><body>
<header><a href="/">波形与频谱</a><a href="/strip">波形长图</a><a href="/waterfall">三维瀑布图</a><strong id="module-title"></strong></header>
<nav id="modules" aria-label="分析模块"></nav>
<div class="layout"><aside><form id="parameters"><h2>分析参数</h2><div id="source-fields"><label>分拣文件<select id="file" required><option value="">请选择文件</option></select></label><label>试验类型<select id="type" disabled required></select></label><label>工况<select id="condition" disabled required></select></label></div><div id="fields"></div><div id="numbers"></div><div id="external" hidden><label>加载外部文件<input id="external-file" type="file"></label><label id="values-label">数据 / 可编辑表<textarea id="values" rows="10"></textarea></label><div id="source-table"></div></div><label><input id="report-graphs" type="checkbox" checked>报表包括图形</label><div id="filter-summary"></div><button type="submit" id="compute" disabled>计算 / 新建</button><p id="error" role="alert"></p></form></aside>
<main><div id="toolbar"><button data-action="title">设置标题</button><button data-action="range">坐标范围</button><button data-action="restore">重绘全图</button><button data-action="filter-x">X 波形滤波</button><button data-action="filter-y">Y 波形滤波</button><button data-action="restore-filter">恢复原始数据</button><button data-action="before">加载配重前数据</button><button data-action="after">加载试重后数据</button><button data-action="period-preview">读取波形 / 选择周期</button><button data-action="decompose-only">独立配重分解</button><button data-action="clear-period">取消周期选择</button><button data-action="image">保存图像</button><button data-action="csv">保存文本</button><button data-action="xlsx">Excel 报表</button><button data-action="docx">Word 报表</button><button data-action="legacy-office">原版 DOC / XLS 报表</button><button data-action="session-save">保存分析配置</button><button data-action="session-load">载入分析配置</button><input id="session-file" type="file" accept=".json" hidden><button data-action="legacy-data">保存 OCA / OAG 结果</button><button data-action="raw">保存外部数据</button><button data-action="batch">批量趋势图 / 报表</button></div><p id="instructions"></p><section id="plots"></section><div id="legend"></div><div class="table-scroll"><table id="result"></table></div></main></div>
<footer id="status" role="status">就绪</footer>
<dialog id="edit-dialog"><form id="edit-form"><h2 id="edit-title"></h2><div id="edit-fields"></div><p id="edit-error"></p><div class="actions"><button type="button" id="edit-cancel">取消</button><button type="submit">确定</button></div></form></dialog>
<dialog id="batch-dialog"><form id="batch-form"><h2>批量趋势输出</h2><p>使用当前文件、试验类型、参考通道、置信度和 CON 时段配置。</p><div id="batch-channels"></div><button id="batch-all" type="button">全选 / 全不选</button><label>输出内容<select id="batch-kind"><option value="images">各通道趋势图 PNG（ZIP）</option><option value="xlsx">Excel 汇总</option><option value="docx">Word 汇总</option><option value="data">逐通道分析数据</option></select></label><label><input id="batch-graphs" type="checkbox" checked>汇总报表包括图形</label><label>图像格式<select id="batch-image-format"><option>png</option><option>bmp</option><option>jpg</option><option>gif</option><option>tiff</option></select></label><label>宽度<input id="batch-width" type="number" min="400" max="8000" value="1400"></label><label>高度<input id="batch-height" type="number" min="300" max="8000" value="950"></label><label><input id="batch-custom-limits" type="checkbox">使用当前主图坐标范围</label><label>CON 时段配置<input id="con-file" type="file" accept=".con"></label><progress id="progress" value="0" max="1"></progress><pre id="batch-log"></pre><div class="actions"><button type="button" id="batch-close">关闭</button><button type="button" id="batch-cancel" disabled>取消任务</button><button type="button" id="batch-download" disabled>下载结果</button><button type="submit" id="batch-go">开始</button></div></form></dialog>
<div id="context" hidden></div></body></html>
